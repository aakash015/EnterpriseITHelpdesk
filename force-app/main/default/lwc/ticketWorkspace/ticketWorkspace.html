<template>
    <lightning-tabset>
        <lightning-tab label="My Tickets">
           <lightning-datatable
            key-field="Id"
            data={myTickets}
            columns={columns}
           >
           </lightning-datatable>
        </lightning-tab>
        <lightning-tab label="Queue Tickets">
            <template lwc:if={selectedRows}>
            <lightning-button label="Create Major Incident"
             onclick={handleCreateMajorIncident}
            >
            </lightning-button>
        </template>
            <br />
            <lightning-datatable
            key-field="Id"
            data={queueTickets}
            columns={queueColumns}
            onrowaction={handleRowAction}
            onrowselection={handleRowSelection}
           >
           </lightning-datatable>
        </lightning-tab>
    </lightning-tabset>
    <lightning-flow onstatuschange={handleStatusChange}></lightning-flow>
</template>
